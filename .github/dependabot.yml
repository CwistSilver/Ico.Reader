version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      xunit:
        patterns:
          - xunit
          - xunit.*
      test-tooling:
        patterns:
          - Microsoft.NET.Test.Sdk
          - Microsoft.Testing.*
          - coverlet.*
