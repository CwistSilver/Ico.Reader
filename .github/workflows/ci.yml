name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 8.0.x supplies the runtime the test project targets; global.json picks the build SDK.
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ico.Reader.Test/Ico.Reader.Test.csproj

      - name: Build
        run: dotnet build Ico.Reader.Test/Ico.Reader.Test.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Ico.Reader.Test/Ico.Reader.Test.csproj -c Release --no-build
          --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test
