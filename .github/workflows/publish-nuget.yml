name: Publish NuGet Package

on:
  release:
    types: [published]

concurrency:
  group: nuget-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  LIBRARY_PROJECT: Ico.Reader/Ico.Reader.csproj
  TEST_PROJECT: Ico.Reader.Test/Ico.Reader.Test.csproj
  ARTIFACTS_PATH: artifacts
  PACKAGE_ID: Ico.Reader
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_USER: Der-Floh

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          value="${TAG#v}"
          if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a NuGet version tag."
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.0.x supplies the runtime the test project targets; global.json picks the build SDK.
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release -clp:ForceConsoleColor

      # pack builds rather than reusing a --no-build output, so -p:Version reaches the compiler
      # and every assembly in the package is stamped with it.
      - name: Pack
        run: >
          dotnet pack ${{ env.LIBRARY_PROJECT }} -c Release
          -o ./${{ env.ARTIFACTS_PATH }}
          -p:Version=${{ steps.version.outputs.value }}
          -clp:ForceConsoleColor

      - name: Verify package
        uses: ./.github/actions/verify-package
        with:
          artifacts-dir: ${{ env.ARTIFACTS_PATH }}
          package-id: ${{ env.PACKAGE_ID }}
          version: ${{ steps.version.outputs.value }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./${{ env.ARTIFACTS_PATH }}/*.nupkg
            ./${{ env.ARTIFACTS_PATH }}/*.snupkg

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./${{ env.ARTIFACTS_PATH }}/*.nupkg
            ./${{ env.ARTIFACTS_PATH }}/*.snupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ env.NUGET_USER }}

      # This pushes the matching .snupkg alongside the .nupkg; a separate push for it would only
      # ever fail as a duplicate.
      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./${{ env.ARTIFACTS_PATH }}/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "${{ env.NUGET_SOURCE }}"
          --skip-duplicate
