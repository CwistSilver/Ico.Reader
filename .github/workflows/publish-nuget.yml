name: Publish NuGet Package

on:
  release:
    types: [ published ]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "value=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >>
          $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Ico.Reader/Ico.Reader.csproj

      - name: Build
        run: dotnet build Ico.Reader/Ico.Reader.csproj
          -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Pack
        run: dotnet pack Ico.Reader/Ico.Reader.csproj -c
          Release --no-build -o ./artifacts -p:Version=${{
          steps.version.outputs.value }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Der-Floh

      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{
          steps.login.outputs.NUGET_API_KEY }}" --source
          "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Publish symbols to NuGet.org
        run: dotnet nuget push "./artifacts/*.snupkg" --api-key "${{
          steps.login.outputs.NUGET_API_KEY }}" --source
          "https://api.nuget.org/v3/index.json"
        continue-on-error: true
