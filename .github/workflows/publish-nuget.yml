name: Publish NuGet Package

on:
  release:
    types: [ published ]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "value=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >>
          $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 8.0.x supplies the runtime the test project targets; global.json picks the build SDK.
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Test
        run: dotnet test Ico.Reader.Test/Ico.Reader.Test.csproj -c Release

      # pack builds rather than reusing a --no-build output, so -p:Version reaches the compiler
      # and every assembly in the package is stamped with it.
      - name: Pack
        run: dotnet pack Ico.Reader/Ico.Reader.csproj -c Release -o ./artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Der-Floh

      # This pushes the matching .snupkg alongside the .nupkg; a separate push for it would only
      # ever fail as a duplicate.
      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{
          steps.login.outputs.NUGET_API_KEY }}" --source
          "https://api.nuget.org/v3/index.json" --skip-duplicate
