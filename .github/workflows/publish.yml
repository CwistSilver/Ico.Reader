name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: nuget-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PROJECT_PATH: Ico.Reader/Ico.Reader.csproj
  PACKAGE_ID: Ico.Reader
  ARTIFACTS_PATH: artifacts
  PACKAGE_ARTIFACT: nuget-package
  NUGET_USER: Der-Floh

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        uses: Der-Floh/Der-Floh/.github/actions/resolve-version@v1
        with:
          tag: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Pack
        uses: Der-Floh/Der-Floh/.github/actions/pack@v1
        with:
          project-path: ${{ env.PROJECT_PATH }}
          version: ${{ steps.version.outputs.value }}
          output-dir: ${{ env.ARTIFACTS_PATH }}

      - name: Verify package
        id: package
        uses: Der-Floh/Der-Floh/.github/actions/verify-package@v1
        with:
          package-dir: ${{ env.ARTIFACTS_PATH }}
          package-id: ${{ env.PACKAGE_ID }}
          version: ${{ steps.version.outputs.value }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./${{ env.ARTIFACTS_PATH }}/*.nupkg
            ./${{ env.ARTIFACTS_PATH }}/*.snupkg

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./${{ env.ARTIFACTS_PATH }}/*.nupkg
            ./${{ env.ARTIFACTS_PATH }}/*.snupkg

      - name: Archive package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            ${{ env.ARTIFACTS_PATH }}/*.nupkg
            ${{ env.ARTIFACTS_PATH }}/*.snupkg
          if-no-files-found: error
          retention-days: 90

      - name: Publish to NuGet.org
        uses: Der-Floh/Der-Floh/.github/actions/publish-nuget@v1
        with:
          package-path: ${{ steps.package.outputs.package-path }}
          symbols-path: ${{ steps.package.outputs.symbols-path }}
          nuget-user: ${{ env.NUGET_USER }}
